[project]
name = "stepix"
version = "0.2.0"
description = "Makes the setup instructions in your README exact and runnable"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stepan Konev" }]
requires-python = ">=3.9"
keywords = ["readme", "setup", "pipeline", "reproducibility", "uv", "ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1",
    "rich>=13",
    "markdown-it-py>=3",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/stepankonev/stepix"
Repository = "https://github.com/stepankonev/stepix"
Issues = "https://github.com/stepankonev/stepix/issues"

[project.scripts]
stepix = "stepix.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["example"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105", "SIM115", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
